name: CD - Deploy to Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cloudgames-cluster

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. .NET Build e Test
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      # 3. Docker Build, Scan e Push
      - name: Docker Login
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tech-challenge-games-alpine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/tech-challenge-games-alpine:latest
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/tech-challenge-games-alpine:latest

      # 4. AWS e Kubernetes Setup
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}
          
          kubectl cluster-info
          kubectl get nodes

      # 5. Deploy to Kubernetes
      - name: Create namespace
        run: |
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      - name: Update Docker image
        run: |
          sed -i "s|YOUR_DOCKER_USERNAME|${{ secrets.DOCKER_USERNAME }}|g" k8s/base/Deployment_simple.yaml
          grep "image:" k8s/base/Deployment_simple.yaml

      - name: Create Kubernetes Secrets
        run: |
          kubectl create secret generic games-service-secrets \
            --from-literal='ConnectionStrings__DefaultConnection=${{ secrets.GAMES_CONNECTION_STRING }}' \
            --from-literal='JwtSettings__Secret=${{ secrets.JWT_SECRET }}' \
            --from-literal='AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}' \
            --from-literal='AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}' \
            --namespace=production \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy ConfigMap
        run: |
          kubectl apply -f k8s/base/Configmap.yaml -n production

      - name: Deploy Application
        run: |
          kubectl apply -f k8s/base/Deployment_simple.yaml -n production
          echo "Aguardando rollout completar..."
          kubectl rollout status deployment/games-service -n production --timeout=5m

      - name: Deploy Service
        run: |
          kubectl apply -f k8s/base/Service.yaml -n production

      - name: Deploy HPA
        run: |
          kubectl apply -f k8s/base/Hpa.yaml -n production

      # 6. Verify Deployment
      - name: Verify deployment
        run: |
          echo "======================================"
          echo "✅ DEPLOYMENT CONCLUÍDO"
          echo "======================================"
          echo ""
          
          echo "=== PODS ==="
          kubectl get pods -n production -l app=games-service -o wide
          echo ""
          
          echo "=== SERVICES ==="
          kubectl get svc -n production
          echo ""
          
          echo "=== HPA ==="
          kubectl get hpa -n production
          echo ""
          
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
          NODE_PORT=$(kubectl get svc games-service -n production -o jsonpath='{.spec.ports[0].nodePort}')
          
          echo "=== API URL ==="
          echo "API: http://$NODE_IP:$NODE_PORT"
          echo "Health: http://$NODE_IP:$NODE_PORT/games/health/live"
          echo "Swagger: http://$NODE_IP:$NODE_PORT/games/swagger"
          echo ""
          
          echo "=== EVENTS ==="
          kubectl get events -n production --sort-by='.lastTimestamp' | tail -10

      # 7. Health Check
      - name: Health Check
        continue-on-error: true
        run: |
          sleep 30
          
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
          NODE_PORT=$(kubectl get svc games-service -n production -o jsonpath='{.spec.ports[0].nodePort}')
          
          if [ -n "$NODE_IP" ] && [ -n "$NODE_PORT" ]; then
            echo "Testing health endpoint..."
            
            for i in {1..5}; do
              if curl -f -s "http://${NODE_IP}:${NODE_PORT}/games/health/live" > /dev/null 2>&1; then
                echo "✅ Health check passed!"
                exit 0
              fi
              echo "Attempt $i failed, waiting..."
              sleep 10
            done
            
            echo "⚠️ Health check did not pass"
          fi