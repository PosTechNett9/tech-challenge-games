apiVersion: v1
kind: Service
metadata:
  name: games-service
  namespace: production
  labels:
    app: games-service
spec:
  type: NodePort
  selector:
    app: games-service
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
    nodePort: 30082
  sessionAffinity: None
---
# Service interno
apiVersion: v1
kind: Service
metadata:
  name: games-service-internal
  namespace: production
  labels:
    app: games-service
spec:
  type: ClusterIP
  selector:
    app: games-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP